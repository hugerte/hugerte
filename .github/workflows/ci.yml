name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run headless tests (slow)"
        type: boolean
        default: false

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # On label events only run when the change is relevant (adding/removing the
    # run-headless label), otherwise skip to avoid burning a build on e.g. a
    # dependabot label.
    if: >
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'run-headless')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Build (TypeScript + oxide + hugerte JS)
        run: pnpm run ci

      - name: Lint
        run: pnpm hugerte-grunt eslint

  headless-tests:
    name: Headless Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    permissions:
      contents: read
    # Run on pushes to main, on manual dispatch with run_tests=true, or on a PR
    # explicitly labeled 'run-headless' (add the label to opt a PR in).
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-headless'))
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0

      - name: Run headless tests (libraries)
        run: pnpm run headless-test

      - name: Run HugeRTE tests (core, plugins, themes)
        run: pnpm hugerte-grunt bedrock-auto:standard

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: modules/hugerte/scratch/TEST-*.xml
          if-no-files-found: ignore
