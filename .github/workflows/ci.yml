name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run headless tests (slow)"
        type: boolean
        default: false

# Superseded commits on the same PR do not need to finish expensive builds/tests.
# Keep label/manual events separate so they cannot cancel a commit's validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.label.name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only adding run-headless should trigger a label-driven build. Checking the
    # event label avoids rerunning tests when an unrelated label is added later.
    if: >
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'run-headless'
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (TypeScript + oxide + hugerte JS)
        run: yarn ci

      - name: Lint
        run: yarn hugerte-grunt eslint

  headless-tests:
    name: Headless Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    permissions:
      contents: read
    # Run on pushes to main, on manual dispatch with run_tests=true, or on a PR
    # explicitly labeled 'run-headless' (add the label to opt a PR in).
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-headless'))
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run headless tests (libraries)
        # CI validates the entire library suite, not Lerna's changed-package set.
        run: yarn headless-test --ignore-lerna-changed

      - name: Run HugeRTE tests (core, plugins, themes)
        run: yarn hugerte-grunt bedrock-auto:standard

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: modules/hugerte/scratch/TEST-*.xml
          if-no-files-found: ignore
