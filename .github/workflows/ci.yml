name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run headless tests (slow)"
        type: boolean
        default: false

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.6.0"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Build (TypeScript + oxide + hugerte JS)
        run: pnpm run ci

      - name: Lint
        run: pnpm run hugerte-grunt eslint

  headless-tests:
    name: Headless Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    permissions:
      contents: read
    # Run on pushes to main branches, or when manually triggered with run_tests=true
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tests == true)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.6.0"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Build
        run: pnpm run ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 134
          install-chromedriver: true
          install-dependencies: true

      - name: Configure Chrome and ChromeDriver paths
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /opt/google/chrome/chrome
          echo "$(dirname ${{ steps.setup-chrome.outputs.chromedriver-path }})" >> $GITHUB_PATH

      - name: Build hugerte bundle
        run: pnpm run hugerte-grunt rollup

      - name: Run headless tests
        run: pnpm run hugerte-grunt bedrock-auto:standard

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: modules/hugerte/scratch/TEST-*.xml
          if-no-files-found: ignore
