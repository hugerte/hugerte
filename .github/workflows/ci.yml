name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run headless tests (slow)"
        type: boolean
        default: false

jobs:
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # On label events only run when the change is relevant (adding/removing the
    # run-headless label), otherwise skip to avoid burning a build on e.g. a
    # dependabot label.
    if: >
      github.event_name != 'pull_request' ||
      github.event.action != 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'run-headless')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build (TypeScript + oxide + hugerte JS)
        run: yarn ci

      - name: Lint
        run: yarn hugerte-grunt eslint

  headless-tests:
    name: Headless Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    permissions:
      contents: read
    # Run on pushes to main, on manual dispatch with run_tests=true, or on a PR
    # explicitly labeled 'run-headless' (add the label to opt a PR in).
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_tests == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-headless'))
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run headless tests
        run: yarn hugerte-grunt bedrock-auto:standard

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: modules/hugerte/scratch/TEST-*.xml
          if-no-files-found: ignore
